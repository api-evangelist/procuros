    OrderResponse:
      type: object
      title: Order Response
      required:
      - header
      properties:
        header:
          $ref: '#/components/schemas/OrderResponseHeader'
        items:
          type: array
          description: 'Conditional based on the `type` field in the header: Required when type is `CHANGE`; optional when type is `ACCEPT` (omit to confirm all lines as-is, or include to selectively confirm specific items); prohibited when type is `REJECT` or when type is omitted/null (both treated as a full rejection). When the type is `CHANGE`, it must contain ALL order line items, regardless whether or not `orderedQuantity` and `confirmedQuantity` are equal.'
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderResponseItem'
        summary:
          description: The summary is required if a modificationGroup exists on the order response, otherwise the summary is optional. In API v3, the summary will be mandatory in any case.
          type: object
          required:
          - subtotalAmount
          - grossAmount
          - netAmount
          - dueAmount
          - totalCharges
          - totalAllowances
          - tax
          properties:
            subtotalAmount:
              type: number
              format: float
              description: The sum of all line item subtotal amounts. The line item subtotal already includes all line item modifications.
            grossAmount:
              type: number
              format: float
              description: The netAmount plus taxes.
            netAmount:
              type: number
              format: float
              description: The subtotalAmount plus totalCharges and minus totalAllowances.
            dueAmount:
              type: number
              format: float
              description: 'The grossAmount minus deposit. Note: deposits are not yet supported, therefore dueAmount will always equal grossAmount for now.'
            totalCharges:
              type: number
              format: float
              description: The total sum of all charges applied on document-level. Does not include charges applied on item-level.
            totalAllowances:
              type: number
              format: float
              description: The total sum of all allowances applied on invoice level. Does not include allowances applied on item-level.
            tax:
              type: object
              minItems: 1
              required:
              - total
              - items
              properties:
                total:
                  type: number
                  format: float
                description:
                  type: string
                  example: Total item tax.
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - percentage
                    - taxableAmount
                    - taxAmount
                    - category
                    properties:
                      percentage:
                        type: number
                        format: float
                      taxableAmount:
                        type: number
                        format: float
                      taxAmount:
                        type: number
                        format: float
                      category:
                        type: string
                        description: Category of the tax, such as "sales", "import", etc. This is free field attribute.
                      description:
                        type: string
            modificationGroups:
              type: array
              items:
                $ref: '#/components/schemas/ModificationGroup'
