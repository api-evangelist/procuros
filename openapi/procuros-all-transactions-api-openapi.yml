      properties:
        orderIdentifier:
          type: string
          description: Order number assigned to the related purchase order by the buyer.
        orderDate:
          $ref: '#/components/schemas/DateTime'
        shipmentIdentifier:
          type: string
          description: Shipment identifier number/reference.
