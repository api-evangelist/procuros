    OrderResponseHeader:
      type: object
      required:
      - buyer
      - supplier
      - orderResponseIdentifier
      - orderResponseDate
      - orderIdentifier
      properties:
        type:
          type: string
          description: Type of the order response. `ACCEPT` means the order was accepted exactly as ordered. `REJECT` means the order was fully rejected. `CHANGE` means part of the order was accepted but either line item quantities or delivery date are changed. **If this field is omitted or set to null, the response is treated identically to `REJECT` — items are prohibited and the order is considered fully rejected. It is strongly recommended to always provide an explicit type.**
          enum:
          - ACCEPT
          - REJECT
          - CHANGE
        version:
          type: integer
          description: If you are sending multiple order responses, this field must be incremented by 1 for each response.
        buyer:
          $ref: '#/components/schemas/Party'
        supplier:
          $ref: '#/components/schemas/Party'
        shipTo:
          description: 'If this is kept empty, the "buyer" is used as the "shipTo" party. Note: unlike other party fields, identifiers are optional for shipTo.'
          allOf:
          - $ref: '#/components/schemas/ShipToParty'
        billTo:
          description: If this is kept empty, the "buyer" is used as the "billTo" party.
          allOf:
          - $ref: '#/components/schemas/Party'
        finalRecipient:
          description: Used in case the shipTo is not the final recipient. Mostly used in dropshipping or cross-docking scenarios.
          allOf:
          - $ref: '#/components/schemas/Party'
        technicalRecipient:
          description: Used when the recipient of the message differs from the buyer or bill_to party. Common in scenarios where invoices or documents need to be sent to a centralized receiving entity (e.g., a group headquarters or shared services center) that differs from the actual buyer or billing party in the transaction.
          allOf:
          - $ref: '#/components/schemas/Party'
        technicalSender:
          description: Used when the sender of the message differs from the supplier party. Common in scenarios where orders or documents are sent from a centralized sending entity (e.g., a group headquarters or shared services center) that differs from the actual buyer in the transaction.
          allOf:
          - $ref: '#/components/schemas/Party'
        orderResponseIdentifier:
          type: string
          example: RE-PO9383-R45
          description: Order response number assigned by the supplier to identify this order response.
        orderResponseDate:
          $ref: '#/components/schemas/DateTime'
        orderIdentifier:
          type: string
          example: PO9383-R45
          description: Order number assigned to this purchase order by the buyer.
        orderDate:
          $ref: '#/components/schemas/DateTime'
        AdditionalOrderIdentifiers:
          $ref: '#/components/schemas/AdditionalOrderIdentifiers'
        confirmedDeliveryDate:
          description: Required on order response type `CHANGE`. Prohibited for `REJECT` type. The confirmed delivery date of the order response.
          allOf:
          - $ref: '#/components/schemas/DateTime'
        confirmedShipmentDate:
          description: The confirmed date on which the goods leave the supplier (shipment/dispatch date). Distinct from the confirmed delivery date, which is when the goods arrive at the destination.
          allOf:
          - $ref: '#/components/schemas/DateTime'
        requestedDeliveryDate:
          description: Required on order response type `CHANGE`. Prohibited for `REJECT` type. The requested delivery date of the order.
          allOf:
          - $ref: '#/components/schemas/DateTime'
        requestedEarliestDeliveryDate:
          description: 'Earliest date of the requested delivery window. Use ISO 8601 date format: YYYY-MM-DD (e.g. 2023-12-06).'
          allOf:
          - $ref: '#/components/schemas/DateTime'
        requestedLatestDeliveryDate:
          description: 'Latest date of the requested delivery window. Use ISO 8601 date format: YYYY-MM-DD (e.g. 2023-12-06).'
          allOf:
          - $ref: '#/components/schemas/DateTime'
        currency:
          $ref: '#/components/schemas/Currency'
        paymentTerms:
          type: array
          description: Used for defining payment targets and optional discounts.
          items:
            $ref: '#/components/schemas/PaymentTerm'
        comments:
          type: string
          maxLength: 100000
          description: Arbitrary human-readable information buyers can send within purchase orders
        deliveryInformation:
          type: string
          maxLength: 100000
          description: Delivery information for the order.
        purchasingInformation:
          type: string
          maxLength: 100000
          description: Additional information about purchasing.
        legalInformation:
          type: string
          maxLength: 100000
          description: Legal notices and information.
        contractReference:
          type: string
          maxLength: 255
          description: Contract reference for the order.
        promotionCode:
          type: string
          maxLength: 255
          description: Promotion code applied to the entire order.
