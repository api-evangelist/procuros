        shippingNoticeIdentifier:
          type: string
          description: Shipment identifier number/reference.
          example: SI-0001
        requestedDespatchDate:
          $ref: '#/components/schemas/DateTime'
        dispatchInstructionResponseDate:
          $ref: '#/components/schemas/DateTime'
        shippingNoticeDate:
          $ref: '#/components/schemas/DateTime'
        requestedDeliveryDate:
          $ref: '#/components/schemas/DateTime'
        expectedDeliveryDate:
          $ref: '#/components/schemas/DateTime'
        carrier:
          type: string
        trackingNumber:
          type: string
        trackingUrl:
          type: string
        comments:
          type: string
          maxLength: 100000
          description: Arbitrary human-readable information buyers can send within dispatch instruction responses
        buyer:
          $ref: '#/components/schemas/Party'
        supplier:
          $ref: '#/components/schemas/Party'
        shipTo:
          description: 'Note: unlike other party fields, identifiers are optional for shipTo.'
          allOf:
          - $ref: '#/components/schemas/ShipToParty'
        billTo:
          $ref: '#/components/schemas/Party'
        shipFrom:
          $ref: '#/components/schemas/Party'
        finalRecipient:
          description: Used in case the shipTo is not the final recipient. Mostly used in dropshipping or cross-docking scenarios.
          allOf:
          - $ref: '#/components/schemas/Party'
        technicalRecipient:
          description: Used when the recipient of the message differs from the buyer or bill_to party. Common in scenarios where invoices or documents need to be sent to a centralized receiving entity (e.g., a group headquarters or shared services center) that differs from the actual buyer or billing party in the transaction.
          allOf:
          - $ref: '#/components/schemas/Party'
        technicalSender:
          description: Used when the sender of the message differs from the supplier party. Common in scenarios where orders or documents are sent from a centralized sending entity (e.g., a group headquarters or shared services center) that differs from the actual buyer in the transaction.
          allOf:
          - $ref: '#/components/schemas/Party'
        modeOfTransport:
          $ref: '#/components/schemas/ModeOfTransport'
        incoTerms:
          $ref: '#/components/schemas/IncoTerms'
        shippingMethod:
          type: string
        status:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        version:
          type: integer
          description: The document version number. Subsequent updates should increment this number by 1.
    DispatchInstructionItem:
      type: object
      required:
      - shippingNoticeLineNumber
      - shippedQuantity
      - orderedQuantity
      - identifiers
      - batches
      properties:
        orderLineNumber:
          type: integer
          example: 1
        orderIdentifier:
          type: string
          description: Order number assigned to the related purchase order by the buyer. Allows referencing different orders on different line items within the same dispatch instruction.
          example: ORDER_123456
        shippingNoticeLineNumber:
          type: integer
          example: 1
        shippedQuantity:
          type: number
          format: float
          example: 1
        orderedQuantity:
          type: number
          format: float
          example: 1
        requestedDeliveryDate:
          $ref: '#/components/schemas/DateTime'
        requestedDespatchDate:
          $ref: '#/components/schemas/DateTime'
        identifiers:
          type: array
          minItems: 1
          description: There must be at least one identifier with domain `GS1` or `BUYER`.
          items:
            $ref: '#/components/schemas/ItemIdentifier'
        unitOfMeasure:
          $ref: '#/components/schemas/UnitOfMeasure'
        unitPrice:
          type: number
          format: float
          default: null
          example: 2
        pricingUnitOfMeasure:
          type: string
          maxLength: 255
          description: The unit of measure used for pricing. This field specifies the unit that the price refers to, which may differ from the quantity unit (e.g., price per carton when quantity is in pieces).
        pricingUnitQuantity:
          type: number
          format: float
          description: 'The quantity of base units contained in the pricing unit of measure. For example, if the price is per carton (pricingUnitOfMeasure: "CT") and each carton contains 100 pieces, this field stores 100.'
        recommendedRetailPrice:
          type: number
          format: float
          default: null
          example: 2
        tax:
          $ref: '#/components/schemas/Tax'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          description: Item description.
        comments:
          type: string
          maxLength: 100000
        minimumRemainingShelfLifeInDays:
          type: integer
          description: Minimum remaining shelf life in days.
        netWeight:
          type: number
          format: float
          description: Net weight of the item in grams.
        grossWeight:
          type: number
          format: float
          description: Gross weight of the item in grams.
        originCountryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: DE
        colorCode:
          type: string
          maxLength: 255
          description: Color code of the item.
        colorName:
          type: string
          maxLength: 255
          description: Color name of the item.
        size:
          type: string
          maxLength: 255
          description: Size of the item.
        dimension:
          type: string
          maxLength: 255
          description: Dimension of the item.
        hsCode:
          type: string
          maxLength: 255
          description: Harmonized System Code of the item.
        organicControlPointNumber:
          type: string
          maxLength: 255
          description: Organic Control Point Number of the supplier - OCPN is a unique identifier that verifies that a producer of organic products is adhering to the standards for organic production.
        batches:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        openQuantityAction:
          type: string
          enum:
          - DISCARDED
          - DELIVERED_LATER
    Attachment:
      type: object
      properties:
        fileName:
          type: string
          description: Name of the file.
        url:
          type: string
          format: uri
          description: URL to the file.
        mimeType:
          type: string
          description: MIME type of the file.
    DispatchInstructionResponse:
      type: object
      title: Dispatch Instruction Response
      required:
      - header
      - transportUnits
      properties:
        header:
          $ref: '#/components/schemas/DispatchInstructionResponseHeader'
        transportUnits:
          type: array
          minItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/DispatchInstructionResponseTransportUnits'
            - type: object
    LineItemAttachment:
      type: object
      description: Document attachment for a line item, such as technical datasheets, product labels, or compliance documents.
      properties:
        fileName:
          type: string
          description: Name of the attachment file.
        url:
          type: string
          format: uri
          description: URL to the attachment file.
        mimeType:
          type: string
          description: MIME type of the attachment file (e.g., application/pdf).
        type:
          $ref: '#/components/schemas/LineItemAttachmentType'
    ProductCatalogIdentity:
      type: object
      description: Product identity containing sender partner ID, receiver partner ID, and GTIN.
      properties:
        senderPartnerId:
          type: string
          description: Sender partner product identifier (e.g., supplier SKU).
          example: SUPPLIER-SKU-12345
        receiverPartnerId:
          type: string
          description: Receiver partner product identifier (e.g., buyer SKU).
          example: BUYER-SKU-67890
        gtin:
          type: string
          description: Global Trade Item Number (GTIN/EAN).
          example: '4260123456789'
  securitySchemes:
    api_token:
      type: http
      scheme: bearer
      description: The API Token of your ERP Connection.
