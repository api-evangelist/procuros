          - $ref: '#/components/schemas/DateTime'
        requestedLatestDeliveryDate:
          description: Latest date of the requested delivery window.
          allOf:
          - $ref: '#/components/schemas/DateTime'
        expectedDeliveryDate:
          $ref: '#/components/schemas/DateTime'
        requestedDespatchDate:
          $ref: '#/components/schemas/DateTime'
