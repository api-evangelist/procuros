                            identifiers:
                            - identifier: '1100001016310'
                              domain: GS1
                            postalAddress:
                              name: ACME Co. Ltd.
                              street: Elroy-Fritsch-Ring 15
                              city: Berlin
                              countryCode: DE
                              postalCode: '82643'
                            contacts:
                            - firstName: John
                              lastName: Doe
                              email: jane.doe@example.com
                              fax: (818) 463-6124
                              phone: +1.352.856.0626
                          supplier:
                            name: Testsupplier
                            identifiers:
