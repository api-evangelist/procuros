openapi: 3.0.3
info:
  title: Procuros All Transactions API
  description: Manage Procuros Transactions.
  version: 2.0.0
servers:
- url: https://api.procuros.io/
- url: https://api.procuros-staging.io/
security:
- api_token: []
tags:
- name: All Transactions
paths:
  /v2/all-transactions:
    get:
      operationId: v2_list_all_transactions
      summary: List All Transactions
      description: List all existing transactions to and from your trade partners.
      tags:
      - All Transactions
      parameters:
      - name: filter[type]
        in: query
        required: false
        allowReserved: true
        schema:
          $ref: '#/components/schemas/TransactionType'
      - name: filter[flow]
        in: query
        required: false
        allowReserved: true
        schema:
          $ref: '#/components/schemas/TransactionFlow'
      - name: filter[status]
        in: query
        required: false
        allowReserved: true
        schema:
          $ref: '#/components/schemas/TransactionStatus'
      - name: filter[created_between]
        in: query
        required: false
        allowReserved: true
        schema:
          type: string
          description: 'Filter transactions created between two dates. Format: YYYY-MM-DD,YYYY-MM-DD'
          example: 2024-01-01,2024-01-31
      - name: cursor
        in: query
        description: Page cursor
        required: false
        schema:
          type: string
      - name: per_page
        in: query
        description: Number of transactions returned per page.
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - hasMore
                - perPage
                - count
                - nextCursor
                - nextPageUrl
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  hasMore:
                    type: boolean
                    description: Whether or not more transactions can be fetched on the next page.
                  perPage:
                    type: integer
                    description: Amount of transactions returned per page.
                  count:
                    type: integer
                    description: Amount of transactions on the current page.
                  nextCursor:
                    type: string
                    nullable: true
                    description: Supplied to the `cursor` query parameter. See [Pagination] for more info.
                  nextPageUrl:
                    type: string
                    format: url
                    nullable: true
                    description: Prebuilt URL to retrieve the next page of transactions.
              examples:
                List of transactions:
                  value:
                    hasMore: false
                    perPage: 100
                    count: 3
                    nextCursor: null
                    nextPageUrl: null
                    items:
                    - procurosTransactionId: 949b2f25-fd9d-4c58-8899-b4dc277f8cf9
                      type: ORDER
                      flow: LIVE
                      status: SUCCESS
                      createdAt: '2024-01-01T00:00:00+00:00'
                      replacesProcurosTransactionId: null
