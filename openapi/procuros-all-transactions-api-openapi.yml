        replacedByProcurosTransactionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the transaction that replaced this one (i.e. a newer version exists).
          example: null
        isLatestVersion:
          type: boolean
          description: Whether this is the latest version of the transaction. False when a newer version exists (see replacedByProcurosTransactionId).
          example: true
