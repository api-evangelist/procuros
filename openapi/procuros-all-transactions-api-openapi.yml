      description: 'If a TransportUnit does not contain sub items (like packages on a pallet), it must contain a nonempty list of items. '
      required:
      - items
      properties:
        unitIdentifier:
          type: string
          description: Transport unit number. (SSCC or NVE)
          example: '340000000000001'
        unitType:
          type: string
          description: 'Transport unit type. Supported values: EURO_PALLET (Euro Pallet 120×80 cm), EURO_PALLET_HALF (1/2 Euro Pallet 80×60 cm), EURO_PALLET_QUARTER (1/4 Euro Pallet 60×40 cm), PALLET (generic/non-Euro pallet), PACKAGE, CARTON, CONTAINER.'
          enum:
          - EURO_PALLET
          - EURO_PALLET_HALF
          - EURO_PALLET_QUARTER
          - CARTON
          - PACKAGE
          - PALLET
          - CONTAINER
        containedTradeUnitCount:
          type: integer
          description: Number of contained trade units. (cases, cartons, etc.)
        requestedDeliveryDate:
          $ref: '#/components/schemas/DateTime'
        expectedDeliveryDate:
