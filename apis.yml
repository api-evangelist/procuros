aid: procuros
name: Procuros
description: >-
  Procuros is a Hamburg-based B2B digital trade platform that connects suppliers with retailers
  and logistics partners through automated document exchange. A single connection lets trading
  partners exchange orders, order responses, invoices, credit notes, shipping notices, dispatch
  instructions, product catalogs and more — whether the partner runs EDI (AS2, SFTP, X.400),
  PDFs, or Excel. Procuros offers ERP connectors (SAP, Microsoft Business Central, Oracle, Odoo,
  Weclapp, Xentral, JTL), an AI-powered Order Agent for PDF/email orders, e-invoicing compliance
  (ZUGFeRD, X-Rechnung, PEPPOL), logistics automation and payment reconciliation. Its REST API v2
  lets integrators list incoming transactions, send outgoing transactions, mark documents
  processed, and report errors — backed by an OpenAPI 3.0.3 spec, cursor pagination, Bearer-token
  auth, and a staging environment. Backed by Creandum and Point Nine.
